name: Refresh crypto feed

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'watchlist.json'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: crypto-pulse-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test data validation and failure handling
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate quotes
        run: python src/crypto_pulse.py
      - name: Add workflow summary
        run: cat data/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit successful feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.csv data/summary.md README.md
          if git diff --cached --quiet; then
            echo 'No feed changes.'
            exit 0
          fi
          git commit -m 'data: refresh crypto feed [skip ci]'
          git push origin HEAD:main
